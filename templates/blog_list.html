{% extends "base.html" %}
{% load static %}
{% block content %}
<section class="container section">
  <h1>The Chai &amp; Chapter Blog</h1>
  <p class="lead">Chai guides, brewing tips and stories from our café in Mumbai.</p>
  <div class="grid two">
    {% for p in posts %}
    <article class="card">
      <img src="{% static p.image %}" width="800" height="600" loading="lazy" alt="{{ p.image_alt }}">
      <h2><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></h2>
      <p class="small"><time datetime="{{ p.published_at|date:'Y-m-d' }}">{{ p.published_at|date:"j M Y" }}</time></p>
      <p>{{ p.excerpt }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
